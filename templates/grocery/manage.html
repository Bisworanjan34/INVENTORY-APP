{% extends 'base.html' %}
{% block title %}ADMIN | {{ mode|upper }}{% endblock %}

{% block body %}
<div class="min-h-screen bg-black/70 text-white p-4 flex justify-center items-start">
    <div class="w-full max-w-[320px]">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xs font-black uppercase tracking-widest text-green-500 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                {% if mode == 'add' %}NEW ASSET{% else %}EDIT ASSET{% endif %}
            </h2>
            <a href="{% url 'grocery:grocery_list' %}" class="text-[10px] font-bold text-gray-400 hover:text-white uppercase transition-all">← Back</a>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            
            <div class="space-y-4">
                <!-- Product Name -->
                <div>
                    <label class="text-[9px] text-green-600 font-bold uppercase mb-1 block">Product Name</label>
                    <input type="text" name="name" value="{{ product.name }}" placeholder="Product Name" required
                        class="w-full bg-[#111] border border-green-900 rounded p-3 text-xs focus:border-green-500 outline-none transition-all">
                </div>

                <!-- Original Price -->
                <div class="mb-4">
                    <label class="block text-[10px] text-green-500 uppercase tracking-widest mb-1">Original Price (Business Trap)</label>
                    <input type="number" name="original_price" value="{{ product.original_price }}" placeholder="Higher value (e.g., 500)" required
                           class="w-full bg-black/50 border border-green-900 text-white p-2 rounded text-xs focus:border-green-500 outline-none">
                </div>

                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="text-[9px] text-green-600 font-bold uppercase mb-1 block">Price</label>
                        <input type="number" name="price" value="{{ product.price }}" placeholder="₹0.00" required
                            class="w-full bg-[#111] border border-green-900 rounded p-3 text-xs outline-none">
                    </div>
                    
                    <div class="flex-1">
                        <label class="text-[9px] text-green-600 font-bold uppercase mb-1 block">Stock(qty)</label>
                        <input type="number" name="stock" value="{{ product.stock }}" placeholder="0" required
                            class="w-full bg-[#111] border border-green-900 rounded p-3 text-xs outline-none">
                    </div>
                </div>

                <!-- Details -->
                <div class="mb-4">
                    <label class="block text-[10px] text-green-500 uppercase tracking-widest mb-1">Product Details</label>
                    <textarea name="details" rows="3" placeholder="Type product description..." 
                              class="w-full bg-black/50 border border-green-900 text-white rounded text-xs focus:border-green-500 outline-none">{{ product.details }}</textarea>
                </div>
            </div>

            <!-- Image Section -->
            <div class="space-y-4">
                <div>
                    <label class="text-[9px] text-green-600 font-bold uppercase mb-1 block flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        Main Product Image
                    </label>
                    <label class="flex items-center justify-center h-24 border border-dashed border-green-900 rounded cursor-pointer overflow-hidden relative group">
                        <img id="mainPreview" src="{% if product.image %}{{ product.image.url }}{% endif %}" class="w-full h-full object-cover {% if not product.image %}hidden{% endif %}">
                        <span id="mainLabel" class="text-[10px] {% if product.image %}hidden{% endif %} group-hover:text-green-500 transition-colors">📁 UPLOAD MAIN</span>
                        
                        <!-- REQUIRED SIRF ADD MODE MEIN HOGA -->
                        <input type="file" name="image" {% if mode == 'add' %}required{% endif %} class="hidden" onchange="previewMain(this)">
                    </label>
                </div>

                <!-- Gallery -->
                <div>
                    <label class="text-[9px] text-green-600 font-bold uppercase mb-1 block flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                        Gallery Images
                    </label>
                    <label class="flex items-center justify-center h-16 border border-dashed border-green-900 rounded cursor-pointer text-[10px] hover:border-green-500 transition-all">
                        + ADD MULTIPLE
                        <input type="file" name="additional_images" multiple class="hidden" onchange="previewGallery(this)">
                    </label>
                    <div id="galleryPreviewContainer" class="flex gap-2 mt-3 flex-wrap"></div>
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-green-600 text-black text-[11px] font-black uppercase rounded shadow-[0_0_15px_rgba(22,163,74,0.4)] hover:bg-green-500 transition-all active:scale-[0.98]">
                SAVE ASSET
            </button>
        </form>
    </div>
</div>

<script>
    function previewMain(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('mainPreview').src = e.target.result;
                document.getElementById('mainPreview').classList.remove('hidden');
                document.getElementById('mainLabel').classList.add('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
    
    function previewGallery(input) {
        const container = document.getElementById('galleryPreviewContainer');
        container.innerHTML = ''; 
        if (input.files) {
            Array.from(input.files).forEach(file => {
                const wrapper = document.createElement('div');
                wrapper.className = "w-14 h-14 rounded overflow-hidden border border-green-900";
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = "w-full h-full object-cover";
                wrapper.appendChild(img);
                container.appendChild(wrapper);
            });
        }
    }
</script>
{% endblock %}
