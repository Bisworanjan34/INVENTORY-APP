{% extends 'base.html' %}
{% load static %}
{% block title %}ORDER_CONFIRMED{% endblock %}

{% block body %}
<style>
    /* Professional Cyber Bike Animation */
    @keyframes driveBike {
        0% { transform: translateX(-40px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(200px); opacity: 0; }
    }
    
    .bike-track {
        position: relative;
        height: 50px;
        margin: 15px 0;
        display: flex;
        align-items: center;
        border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }

    .bike-container {
        position: absolute;
        width: 45px;
        animation: driveBike 4.5s linear infinite;
        filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.5));
    }

    /* Cyber Pro Glass Card */
    .cyber-card {
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }
</style>

<!-- Main Green Cyber Background -->
<div class=" flex items-center justify-center p-4 bg-green-800/80 relative overflow-hidden">
    
    <!-- Abstract Cyber Glow -->
    <div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 50% 50%, #ffffff 1px, transparent 1px); background-size: 30px 30px;"></div>

    <!-- Main Card -->
    <div class="cyber-card w-full max-w-[300px] p-6 rounded-[2rem] text-center relative z-20">
        
        <!-- Animated Pulse Icon -->
        <div class="relative mb-5">
            <div class="mx-auto w-16 h-16 bg-white/10 rounded-full flex items-center justify-center border border-white/20 animate-pulse">
                <i class="fas fa-check text-white text-2xl"></i>
            </div>
        </div>

        <!-- Success Text -->
        <h2 class="text-white text-xl font-black uppercase tracking-tighter">
            Order <span class="text-green-300">Success</span>
        </h2>
        <p class="text-white/60 text-[9px] font-mono uppercase tracking-widest mt-1 mb-6">
            ID: {{ order.id|default:"#LIPU-9921" }}
        </p>

        <!-- Cyber Bike Track -->
        <div class="bike-track">
            <div class="bike-container">
                <img src="{% static 'images/delivery.png' %}" alt="Bike" class="w-full">
            </div>
        </div>

        <!-- Dispatch Stats -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-white/5 p-2 rounded-xl border border-white/10">
                <p class="text-[8px] text-white/50 uppercase">Status</p>
                <p class="text-[10px] text-green-300 font-bold">DISPATCHING</p>
            </div>
            <div class="bg-white/5 p-2 rounded-xl border border-white/10">
                <p class="text-[8px] text-white/50 uppercase">ETA</p>
                <p class="text-[10px] text-white font-bold">45 MINS</p>
            </div>
        </div>

        <!-- Button -->
        <a href="{% url 'grocery:grocery_list' %}" 
           class="block w-full py-3.5 bg-white text-green-900 font-black uppercase tracking-widest text-[11px] rounded-full hover:bg-green-200 transition-all active:scale-95 shadow-lg">
            Continue Shopping
        </a>
    </div>
</div>
{% endblock %}
